version: "3.8"

services:
  app:
    build: .
    container_name: lesson-prep-assistant
    ports:
      - "8000:8000"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LLM_MODEL=qwen-plus
      - DEBUG=false
    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads
    restart: unless-stopped

volumes:
  app_data:
  app_uploads: